<!DOCTYPE html>
<html lang="{{ $.Site.LanguageCode }}">
    {{- partial "head.html" . -}}
    <body a="{{ $.Site.Params.theme_config.appearance | default "auto" }}">
        <nav class="w">
            <a href="/">Fathan Mubina</a>
            <span>
                <a href="/">about</a>
                <span class="sep">/</span>
                <a href="/reads">reads</a>
                <span class="sep">/</span>
                <a href="/contact">contact</a>
                <span class="sep">/</span>
                <button id="theme-toggle" aria-label="Toggle theme"></button>
            </span>
        </nav>
        <script>
          (function() {
            var saved = localStorage.getItem('theme');
            if (saved) document.body.setAttribute('a', saved);
            function updateLabel() {
              var current = document.body.getAttribute('a');
              var isDark = current === 'dark' || (current === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
              document.getElementById('theme-toggle').textContent = isDark ? '𖤓' : '⏾';
            }
            updateLabel();
            document.getElementById('theme-toggle').addEventListener('click', function() {
              var current = document.body.getAttribute('a');
              var next = (current === 'dark') ? 'light' : 'dark';
              document.body.setAttribute('a', next);
              localStorage.setItem('theme', next);
              updateLabel();
            });
          })();
        </script>
        <hr>
        <main class="page-content" aria-label="Content"> 
            <div class="w">
                {{- block "main" . }}{{- end }}
                {{ partial "footer.html" }}
            </div>
        </main>
    </body>
</html>

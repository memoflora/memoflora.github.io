<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) document.body.setAttribute('a', saved);
    function updateLabel() {
      var current = document.body.getAttribute('a');
      var isDark = current === 'dark' || (current === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.getElementById('theme-toggle').textContent = isDark ? '𖤓' : '⏾';
    }
    updateLabel();
    document.getElementById('theme-toggle').addEventListener('click', function() {
      var current = document.body.getAttribute('a');
      var next = (current === 'dark') ? 'light' : 'dark';
      document.body.setAttribute('a', next);
      localStorage.setItem('theme', next);
      updateLabel();
    });
  })();
</script>
